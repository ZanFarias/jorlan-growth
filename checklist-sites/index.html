<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Correções nos Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--card:#0f0f13;--card-2:#15151a;--line:#24232a;--fg:#f5f4f0;--sub:rgba(255,255,255,.68);--gold:#d4af37;--gold-2:#f0cf6a;--red:#e5484d;--green:#3fbf7f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Montserrat",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;font-weight:800;margin:0 0 22px}
h1 span{color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.st.now{border-color:var(--gold)}
.st b{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:800;flex:none}
.st div{font-size:13px;font-weight:700;line-height:1.35}
.st small{display:block;font-weight:500;color:var(--sub);font-size:11px}
@media(max-width:640px){.steps{grid-template-columns:1fr}}
.site{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:15px;font-weight:700}
.sh h2 a{display:block;font-size:11px;font-weight:500;color:var(--sub);text-decoration:none;margin-top:2px;overflow-wrap:anywhere}
.cnt{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.cnt.ok{color:var(--green)}
label{display:flex;gap:10px;align-items:flex-start;background:var(--card-2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.45;cursor:pointer}
label input{width:18px;height:18px;accent-color:var(--gold);margin:1px 0 0;flex:none}
label.done{opacity:.45}
label.done span{text-decoration:line-through}
.u{color:var(--red);font-weight:800;font-size:10px;margin-right:4px}
em{font-style:normal;color:var(--gold-2);font-weight:600;overflow-wrap:anywhere}
s{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<h1>Correções de <span>WhatsApp</span> nos sites</h1>
<div class="steps">
  <div class="st now"><b>1</b><div>Consórcio<small>Chevrolet DF, Orca, Honda · hoje</small></div></div>
  <div class="st"><b>2</b><div>Geely e links<small>esta semana</small></div></div>
  <div class="st"><b>3</b><div>Modelo no botão<small>todos os sites</small></div></div>
</div>
<div id="s"></div>
</div>
<script>
const W="Troque os links <s>web.whatsapp.com</s> por <em>https://wa.me/55...</em> (mesmo número, sem espaço)";
const M="Na página de cada modelo, o texto do botão leva o modelo: <em>Olá! Vim pelo site #Novos #Haval_H7</em>";
const S=[
["Chevrolet DF e Valparaíso","https://chevroletjorlan.com.br/df/",[
 [1,"/df/consorcio: troque <s>2106-6024</s> por <em>https://wa.me/556134217314</em> nos botões e no ícone"],
 [0,"Todas as páginas: troque <s>phone=6121010101</s> por <em>https://wa.me/556121010101</em>"],[0,M]]],
["Chevrolet Orca","https://chevroletorca.com.br",[
 [1,"/consorcio: troque <s>2106-6024</s> e <s>2106-6000</s> por <em>https://wa.me/556134217314</em> nos botões e no ícone"],
 [0,"Todas as páginas: troque <s>phone=6121066000</s> por <em>https://wa.me/556121066000</em>"],[0,M]]],
["Honda Jorlan Plaza","https://www.hondajorlanplaza.com.br",[
 [1,"/consorcio: troque <s>2106-6024</s> por <em>https://wa.me/556134217314</em> nos botões e no ícone"],
 [0,"Todas as páginas: troque <s>phone=6137992000</s> por <em>https://wa.me/556137992000</em>"],[0,M]]],
["Geely DF","https://www.geelybrasil.com.br/jorlan-df",[
 [1,"Ligue o botão de WhatsApp: <em>https://wa.me/556121030330</em>"],
 [0,"Adicione o botão de pós-venda: <em>https://wa.me/556121030335</em>"]]],
["Geely BH","https://www.geelybrasil.com.br/jorlan-bh",[
 [1,"Ligue o botão de WhatsApp: <em>https://wa.me/553121228000</em>"],
 [0,"Adicione o botão de pós-venda: <em>https://wa.me/553121228080</em>"]]],
["Chevrolet Goiânia","https://chevroletjorlan.com.br/go",[
 [0,"Todas as páginas: troque <s>phone=6240001618</s> por <em>https://wa.me/556240001618</em>"],
 [0,"/go/consorcio: troque o link com espaço por <em>https://wa.me/556240052509</em>"],[0,M]]],
["Chevrolet BH","https://jorlanchevrolet.com.br/bh",[
 [0,"Todas as páginas: troque <s>phone=3121223000</s> por <em>https://wa.me/553121223000</em>"],
 [0,"/bh/consorcio: troque o link com espaço por <em>https://wa.me/553121221919</em>"],[0,M]]],
["GAC DF","https://gacjorlanmotors.com.br/df",[
 [0,"Todas as páginas: troque <s>phone=6121030300</s> por <em>https://wa.me/556121030300</em>"],
 [0,"Adicione o botão de pós-venda: <em>https://wa.me/556121030310</em>"],
 [0,"Ofertas: separe o <s>#Novosgacjorlanmotors...</s> com espaço e coloque o modelo"]]],
["GAC BH","https://gacjorlanmotors.com.br/bh",[
 [0,"Todas as páginas: troque <s>phone=3140094009</s> por <em>https://wa.me/553140094009</em>"],
 [0,"Adicione o botão de pós-venda: <em>https://wa.me/553140094039</em>"]]],
["GWM","https://www.gwmjorlan.com.br",[[0,W],[0,M]]],
["Renault DF","https://renaultjorlanfrance.com.br",[[0,W],[0,M]]],
["Renault BH","https://renaultjorlan.com.br",[[0,W],[0,"Adicione o botão de consórcio: <em>https://wa.me/553121221919</em>"],[0,M]]],
["Kia","https://kiajorlanmotors.com.br",[[0,W],[0,M]]],
["Site do Grupo","https://grupojorlan.com.br",[
 [0,"/vendas-diretas: troque o link com espaço por <em>https://wa.me/556121010101</em>"],
 [0,"/trabalhe-conosco: adicione o WhatsApp do RH <em>https://wa.me/556240052188</em>"]]]
];
const K="jorlan-chk-v2";let st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const box=document.getElementById("s");
box.innerHTML=S.map((x,i)=>`<div class="site"><div class="sh"><h2>${x[0]}<a href="${x[1]}" target="_blank" rel="noopener">${x[1]}</a></h2><span class="cnt"></span></div>${x[2].map((t,j)=>{const id=i+"-"+j,on=st[id];return `<label class="${on?"done":""}"><input type="checkbox" data-id="${id}"${on?" checked":""}><span>${t[0]?'<span class="u">URGENTE</span>':""}${t[1]}</span></label>`}).join("")}</div>`).join("");
function cnt(){document.querySelectorAll(".site").forEach(d=>{const a=d.querySelectorAll("input"),f=[...a].filter(x=>x.checked).length,c=d.querySelector(".cnt");c.textContent=f+" de "+a.length;c.classList.toggle("ok",f==a.length)})}
box.addEventListener("change",e=>{const x=e.target;if(!x.dataset.id)return;if(x.checked)st[x.dataset.id]=1;else delete st[x.dataset.id];try{localStorage.setItem(K,JSON.stringify(st))}catch(_){}x.closest("label").classList.toggle("done",x.checked);cnt()});
cnt();
</script>
</body>
</html>

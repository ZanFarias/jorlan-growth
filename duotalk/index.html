<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duotalk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Growth Jorlan — abas Quem Somos, Lojas, Produtos, Público, Analytics e Mídia Paga (subabas Visão geral, Google e Meta); — cabeçalho com período, abas por canal, blocos retráteis de cards KPI, detalhamento por campanha, tabelas e barras; preto com branco e dourado */
:root{
  --bg:#060608; --card:#0f0f13; --card-2:#15151a; --line:#24232a; --line-2:#302f37;
  --fg:#f5f4f0; --muted:#8f8d87; --dim:#5f5e64;
  --gold:#d4af37; --gold-2:#f0cf6a; --gold-soft:rgba(212,175,55,.10);
  --f:"Montserrat",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.01em}
.crumb{margin:4px 0 0;font-size:12px;color:var(--muted)}
.period{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap}
.period::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.pane{display:grid;gap:22px}

.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row.five{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.kpi .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .num{font-size:clamp(22px,2.3vw,28px);font-weight:800;color:#fff;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.dv{font-weight:700}.dv.up{color:#3ddc84;text-shadow:0 0 10px rgba(61,220,132,.45)}.dv.dn{color:#ff5a5a;text-shadow:0 0 10px rgba(255,90,90,.45)}
.kpi.hl{border-color:rgba(212,175,55,.55);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,0) 70%),var(--card)}
.kpi.hl .num{color:var(--gold-2);text-shadow:0 0 18px rgba(212,175,55,.35)}
.kpi.hl .lbl{color:#d9c382}
.kpi.pend .num{color:var(--dim)}
.badge{justify-self:start;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px dashed var(--gold);color:var(--gold)}

.q{position:relative;flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;cursor:help;font-family:var(--f)}
.q:hover,.q:focus{border-color:var(--gold);color:var(--gold);outline:none}
.q .tt{position:absolute;z-index:30;top:calc(100% + 8px);right:-6px;width:max-content;max-width:min(270px,72vw);background:#1b1a20;border:1px solid var(--gold);border-radius:8px;padding:9px 11px;font-size:12px;font-weight:500;line-height:1.45;color:var(--fg);text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.6);display:none;pointer-events:none;white-space:normal}
.q.l{position:static}
.q.l .tt{right:auto;left:0;top:calc(100% + 2px);max-width:min(300px,100%)}
summary{position:relative}
.q:hover .tt,.q:focus .tt{display:block}

details.sec{border-top:1px solid var(--line);padding-top:14px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;font-size:13.5px;font-weight:700;color:var(--gold)}
details.sec>summary .hint{font-size:11.5px;color:var(--muted)}
.chev{width:14px;height:14px;color:var(--gold);transition:transform .15s;transform:rotate(-90deg)}
details[open]>summary .chev{transform:none}
.sec-body{display:grid;gap:12px}

details.camp{background:var(--card);border:1px solid var(--line);border-radius:10px}
details.camp>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:11px 14px;border-bottom:1px solid transparent}
details.camp[open]>summary{border-bottom-color:var(--line)}
details.camp>summary::-webkit-details-marker{display:none}
.camp .cn{font-weight:700;font-size:13px;color:#fff;display:flex;align-items:center;gap:8px}
.camp .cm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.camp .cm b{color:#fff;font-weight:700}
.camp .cm b.g{color:var(--gold-2)}
.camp ul{list-style:none;margin:0;padding:8px 10px 10px;display:grid;gap:6px}
.camp li{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;background:var(--card-2);border-left:2px solid var(--gold);border-radius:0 6px 6px 0;padding:7px 10px;font-size:12px;color:#cfcdc6}
.camp li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
.camp li.bad span:last-child{color:var(--gold-2)}
.camp .none{padding:10px 14px;font-size:12px;color:var(--muted)}
.camp li small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.nd{padding:10px 14px 14px;display:grid;gap:10px}
.nd h4{margin:4px 0 0;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.camp .nd ul.ck{padding:0}
.mt{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.mt div{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.mt div.key{border-color:rgba(212,175,55,.55)}
.mt b{font-size:12px;font-weight:700;color:#fff}
.mt div.key b{color:var(--gold-2)}
.mt span{font-size:11.5px;color:var(--muted)}
.cards{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.cc{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.cc.warn{border-color:rgba(212,175,55,.55)}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-n{font-size:12.5px;font-weight:700;color:#fff;line-height:1.3}
.cc-kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cc-kp div,.cc dl div{display:grid;gap:2px;min-width:0}
.cc-kp span,.cc dt{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cc-kp b{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.cc.warn .cc-kp .key b{color:var(--gold-2)}
.cc dl{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.cc dd{margin:0;font-size:12.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.cc dd.na{color:var(--dim);font-weight:500}
.cc-note{font-size:11px;color:var(--muted)}

.tbl-title{position:relative;display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:700;color:#fff}
th.srt{cursor:pointer;user-select:none}
th.srt::after{content:"↕";margin-left:5px;color:var(--dim);font-size:10px}
th.srt[data-dir="desc"]::after{content:"↓";color:var(--gold)}
th.srt[data-dir="asc"]::after{content:"↑";color:var(--gold)}
th.srt[data-dir]{color:var(--gold-2)}
.tf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 8px}
.tf button{font:inherit;font-size:11.5px;font-weight:600;background:transparent;color:#cfcdc6;border:1px solid var(--line-2);border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.tf button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#060608}
.tf small{font-size:10.5px;color:var(--dim);margin-left:4px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.n,th.n{text-align:right;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:11.5px;color:#bdbbb4}
td.why{color:var(--muted);min-width:220px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.gold{background:rgba(212,175,55,.16);color:var(--gold-2);border:1px solid rgba(212,175,55,.5)}
.pill.white{background:#fff;color:#060608}
.pill.grey{background:var(--line);color:#cfcdc6}
.pill.dash{border:1px dashed var(--gold);color:var(--gold)}

.bars{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px 12px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:end;min-height:250px}
.bar{display:grid;justify-items:center;gap:6px;min-width:0}
.bar .v{font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .col{width:min(64px,70%);border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold-2),#8a6d1c);box-shadow:0 0 18px rgba(212,175,55,.25)}
.bar .k{font-size:11px;color:var(--muted);text-align:center}
.bar.dim .col{opacity:.3;box-shadow:none}
.bar.dim .v{color:var(--muted)}
.bars:has(.bar:nth-child(7)) .bar .v{font-size:10px}
.bars:has(.bar:nth-child(7)) .bar .p{display:none}
@media (max-width:700px){.bars:has(.bar:nth-child(7)) .bar .v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}}
.bar .p{font-size:10.5px;color:var(--dim)}
.pf-wrap{position:relative}
button.period{font:inherit;font-size:12px;font-weight:600;cursor:pointer}
button.period:hover,button.period[aria-expanded="true"]{border-color:var(--gold)}
button.period .chev{transform:none;width:12px;height:12px}
button.period[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pf{position:absolute;z-index:40;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 32px));display:grid;gap:14px;background:#141418;border:1px solid var(--gold);border-radius:12px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.7)}
.pf-g{display:grid;gap:6px;min-width:0}
.pf-h{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button,.mo button,.pre{font:inherit;font-size:12px;font-weight:600;background:transparent;color:#cfcdc6;border:0;padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"],.mo button[aria-pressed="true"],.pre[aria-pressed="true"]{background:var(--gold);color:#060608}
.mo{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mo button[data-m="all"]{grid-column:1/-1}
.seg{justify-self:start}
.pre{justify-self:start}
.mo button{border:1px solid var(--line-2);border-radius:8px}
.mo button:disabled{color:var(--dim);border-color:var(--line);cursor:not-allowed}
.pre{border:1px solid var(--gold);border-radius:8px;color:var(--gold);display:inline-flex;align-items:center;gap:6px}
.pre::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pf{width:min(360px,calc(100vw - 32px))}
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pf-r{justify-items:end}
.pf-m,.pf-d{display:grid;gap:14px}
.pf-m[hidden],.pf-d[hidden]{display:none}
.pf-h small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim);margin-left:6px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.cal-h button,.pf-fb button{font:inherit;font-size:12px;font-weight:600;background:transparent;border:1px solid var(--line-2);color:#cfcdc6;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.cal-h button{font-size:15px;line-height:1;padding:5px 12px}
.cal-h button:disabled,.pf-fb button:disabled{color:var(--dim);border-color:var(--line);cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{font:inherit;font-size:12px;font-weight:600;background:transparent;color:#cfcdc6;border:1px solid var(--line-2);border-radius:8px;padding:7px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.cal button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#060608}
.cal button:disabled{color:var(--dim);border-color:var(--line);cursor:not-allowed}
.pf-tip{margin:0;font-size:10.5px;color:var(--dim)}
.pf-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pf-fb{display:inline-flex;gap:6px}
.pf-fb button[hidden]{display:none}
@media (max-width:560px){.pf-wrap{width:100%}.pf{left:0;right:auto;width:100%}}
.empty{background:var(--card);border:1px dashed var(--line-2);border-radius:10px;padding:36px 20px;display:grid;justify-items:center;gap:10px;text-align:center}
.empty h2{margin:0;font-size:17px;color:#fff}
.empty p{margin:0;color:var(--muted);max-width:56ch}
.empty .pre{margin-top:6px}
footer{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px;display:grid;gap:4px}
@media (max-width:560px){.bars{min-height:220px;gap:6px}.bar .v{font-size:10.5px}h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){.chev,.q .tt{transition:none}}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{font:inherit;font-size:12px;font-weight:600;background:transparent;color:#cfcdc6;border:1px solid var(--line-2);border-radius:99px;padding:6px 14px;cursor:pointer}
.subtabs button:hover{border-color:var(--gold)}
.subtabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#060608}
.intro .lead{margin:0;max-width:70ch;font-size:16px;line-height:1.55;font-weight:500;color:#fff;text-wrap:pretty}
.story{display:grid;gap:10px;max-width:72ch}
.story p{margin:0;color:#cfcdc6;line-height:1.6}
ol.tl{list-style:none;margin:0;padding:0 0 0 6px;display:grid;gap:0;border-left:1px solid var(--line-2);margin-left:52px}
ol.tl li{position:relative;display:grid;grid-template-columns:1fr;padding:7px 0 7px 18px;font-size:12.5px;color:#cfcdc6}
ol.tl li::before{content:"";position:absolute;left:-10.5px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--card);border:1px solid var(--gold)}
ol.tl li.m::before{background:var(--gold);box-shadow:0 0 10px var(--gold)}
ol.tl .ta{position:absolute;left:-64px;top:6px;width:44px;text-align:right;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
ol.tl li.m .ta{color:var(--gold-2);text-shadow:0 0 12px rgba(212,175,55,.4)}
ol.tl li.m .tt2{color:#fff;font-weight:600}
b.w{color:#fff}
.note{margin:0;font-size:12px;color:var(--muted);max-width:90ch}
.pane>.subtabs+.pane{margin-top:0}
ul.lojas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.loja{display:grid;grid-template-columns:64px minmax(0,300px) minmax(0,1fr);align-items:center;gap:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 8px;min-width:0}
.loja:hover{border-color:rgba(212,175,55,.45)}
.loja img{display:block;width:64px;height:64px;object-fit:cover;border-radius:6px;max-width:100%;background:var(--card-2)}
.loja .li{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:1px 8px;min-width:0}
.loja .ano{grid-row:span 3;align-self:center;font-size:13px;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(212,175,55,.35)}
.loja h3{margin:0;font-size:13px;font-weight:700;color:#fff}
.loja .un{font-size:11px;color:var(--muted)}
.rate{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate .star{width:12px;height:12px;fill:var(--gold)}
.rate b{font-size:13px;font-weight:800;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.25)}
.rate.low b{color:var(--gold-2)}
.lk{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.lk a{font-size:11.5px;font-weight:600;color:var(--fg);text-decoration:none;border:1px solid var(--line-2);border-radius:99px;padding:4px 10px;white-space:nowrap}
.lk a:hover{border-color:var(--gold);color:var(--gold-2)}
.lk a.wa{border-color:rgba(212,175,55,.5);color:var(--gold-2);background:var(--gold-soft)}
.tel{font-size:11.5px;color:var(--muted);align-self:center}
.tel .sel{color:#fff;font-weight:600;user-select:all}
@media (max-width:860px){.loja{grid-template-columns:64px minmax(0,1fr)}.loja .lk{grid-column:1/-1;justify-content:flex-start}}
.grp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.gcard h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gcard .lk{justify-content:flex-start}
ul.att{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.att li{display:grid;gap:2px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12px;color:var(--muted)}
ul.att li b{color:#fff;font-size:12.5px}
.cf{display:grid;gap:8px}
.cf .subtabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#060608}
.cls{display:grid;gap:8px}
details.cl{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
details.cl[open]{border-color:rgba(212,175,55,.45)}
details.cl>summary{list-style:none;cursor:pointer;background:none;border:0;border-radius:10px}
details.cl>summary::-webkit-details-marker{display:none}
details.cl>summary:hover{border-color:transparent}
.sc{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 14px}
.sc div{display:grid;gap:1px;text-align:right;min-width:0}

/* nenhum texto curto quebra linha: reduz a fonte do elemento até ele caber na largura */
const FIT='.kpi .sp span,.kpi .sp b,.kpi .sp small,.kpi .num,.kpi .lbl>span:first-child,.kpi .sub,.cc-kp b,.cc-kp span,.cc dt,.cc dd,.cc-n,.vs-k b,.vs-k span,.stc-k b,.stc-k span,.tc-k b,.tc-k span,.cr-k b,.cr-k span,.rv-k b,.rv-k span,.sc b,.sc div span,.hb-v b,.hb-v small,.hb-n,.bcd-c,.tc-d b,.mf-t b,.fl-f span,.camp .cn,.camp .cm>span,.camp li span:last-child,.pz li b,.pz li span,.prc-n,h1,.vs-c h3,.tc-n,.rv-n,.cr-n,.stc-h h3,.bcd-h h3,.vz-h b,ul.att li b,.chip span,.mt b,.win-n,.win-k b,.win-k span,.fn-l,.fn-v,.fn-h span,ul.stk-l span,ul.stk-l b,ul.eq li span:first-child,.cv-n,.cv-c,.cv-key b,.cv-key span,.cv-m dt,.cv-m dd,.cv-ph b,.cv-p,.ma-n b,.ma-n span,.ma-k b,.ma-k>span,.gl span,.gl-f b,.tp-c,ol.ma-r li b,.ma-h';
/* títulos e nomes param em 11px e mostram o texto inteiro ao passar o mouse */
const FITT='.tp-n,.gl-f b,.tp-v,.cv-n,.ma-n b,ol.ma-r li b,.win-n,.fn-l,.tc-n,.cc-n,.rv-n,.cr-n,.stc-h h3,.bcd-h h3,.vz-h b,ul.att li b,.camp .cn,.vs-c h3,.hb-n,.chip span,h1';
function fitAll(){document.querySelectorAll(FIT).forEach(el=>{if(!el.offsetParent)return;el.style.fontSize='';
  el.style.letterSpacing='';el.style.textTransform='';
  const over=()=>el.scrollWidth>el.clientWidth+1;
  if(over())el.style.letterSpacing='0';
  if(over()&&getComputedStyle(el).textTransform==='uppercase'&&!el.matches('.num,b'))el.style.textTransform='none';
  let fs=parseFloat(getComputedStyle(el).fontSize);const mn=Math.min(fs,el.matches(FITT)?11:8.5);
  while(over()&&fs>mn){fs-=.5;el.style.fontSize=fs+'px'}
  if(el.scrollWidth>el.clientWidth+1&&!el.title)el.title=el.textContent.trim()})}
document.addEventListener('click',e=>{const b=e.target.closest('button.tp-all');if(!b)return;const box=b.closest('.ma-b');if(!box)return;
  const ds=[...box.querySelectorAll('details.tp')].filter(d=>!d.classList.contains('off')),cl=ds.some(d=>d.open);ds.forEach(d=>d.open=!cl);b.textContent=cl?'Abrir todos':'Recolher todos';fitSoon()});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.tp')){const box=e.target.closest('.ma-b'),b=box&&box.querySelector('button.tp-all');if(b)b.textContent=[...box.querySelectorAll('details.tp:not(.off)')].some(d=>d.open)?'Recolher todos':'Abrir todos';fitSoon()}},true);
let fitQ=0;const fitSoon=()=>{if(fitQ)return;fitQ=requestAnimationFrame(()=>{fitQ=0;fitAll()})};
new MutationObserver(fitSoon).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','open']});
addEventListener('resize',fitSoon);document.addEventListener('toggle',fitSoon,true);
try{document.fonts.ready.then(fitSoon)}catch(e){}

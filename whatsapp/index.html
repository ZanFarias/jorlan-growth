}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45}
h1{margin:0;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.01em}
.crumb{margin:4px 0 0;font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.kpi .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .num{font-size:clamp(22px,2.3vw,28px);font-weight:800;color:#fff;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.hl{border-color:rgba(212,175,55,.55);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,0) 70%),var(--card)}
.kpi.hl .num{color:var(--gold-2);text-shadow:0 0 18px rgba(212,175,55,.35)}
.kpi.hl .lbl{color:#d9c382}
.kpi.pend .num{color:var(--dim)}
.q{position:relative;flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;cursor:help;font-family:var(--f)}
.q:hover,.q:focus{border-color:var(--gold);color:var(--gold);outline:none}
.q .tt{position:absolute;z-index:30;top:calc(100% + 8px);right:-6px;width:max-content;max-width:min(270px,72vw);background:#1b1a20;border:1px solid var(--gold);border-radius:8px;padding:9px 11px;font-size:12px;font-weight:500;line-height:1.45;color:var(--fg);text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.6);display:none;pointer-events:none;white-space:normal}
.q.l{position:static}
.q.l .tt{right:auto;left:0;top:calc(100% + 2px);max-width:min(300px,100%)}
.q:hover .tt,.q:focus .tt{display:block}
.kpi .num{white-space:nowrap;min-width:0}
.kpi .lbl>span:first-child{overflow:visible}
.kpi{grid-template-columns:minmax(0,1fr)}
.kpi .sp{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;margin-top:4px;padding-top:9px;border-top:1px solid rgba(212,175,55,.3)}
.kpi .sp div{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;min-width:0}
.kpi .sp span{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#d9c382;white-space:nowrap;min-width:0}
.kpi .sp b{font-size:18px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;text-shadow:0 0 12px rgba(255,255,255,.25)}
.kpi .sp small{font-size:10.5px;color:var(--muted);white-space:nowrap;min-width:0}

html{background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 56px;display:grid;gap:22px}
.pane{display:grid;gap:22px}
/* v6 WHATSAPP (Zan 09/11): tripla checagem dos números */
.wa-cs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.wa-c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.wa-c.w-cr{border-color:rgba(255,90,90,.6)}
.wa-c.w-dv{border-color:rgba(212,175,55,.55)}
.wa-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wa-h>div{display:grid;gap:2px;min-width:0}
.wa-n{font-size:17px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 12px rgba(255,255,255,.22)}
.wa-l{font-size:11.5px;color:rgba(255,255,255,.68)}
.wa-st{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.wa-st.w-cr{background:rgba(255,90,90,.16);color:#ff7a7a;border:1px solid rgba(255,90,90,.6)}
.wa-st.w-dv{background:rgba(212,175,55,.16);color:var(--gold-2);border:1px solid rgba(212,175,55,.5)}
.wa-st.w-ok{background:rgba(61,220,132,.12);color:#3ddc84;border:1px solid rgba(61,220,132,.45)}
.wa-k{display:grid;gap:5px;min-width:0}
.wa-k .wa-r{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:baseline;font-size:11.5px;color:#cfcdc6;line-height:1.4}
.wa-k .wa-r>span{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wa-k .wa-r b{font-weight:600;color:#fff;min-width:0;overflow-wrap:anywhere}.wa-k .wa-r.x b{color:#ff7a7a}.wa-k .wa-r.a b{color:var(--gold-2)}
.wa-a{margin:0;font-size:11.5px;color:#fff;border-left:2px solid var(--gold);padding-left:8px;line-height:1.4}

/* v7: cards clicáveis com seta dourada (padrão Concorrência) */
#p-whatsapp .kpi[data-wx]{cursor:pointer;padding-bottom:26px;transition:border-color .15s,box-shadow .15s}
#p-whatsapp .kpi[data-wx]:hover{border-color:rgba(212,175,55,.6)}
#p-whatsapp .kpi[data-wx][aria-expanded="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(212,175,55,.25)}
#p-whatsapp .kpi[data-wx]::before{content:none}
#p-whatsapp .kpi[data-wx]::after{content:"";position:absolute;left:17px;bottom:12px;width:6px;height:6px;border-right:1.5px solid var(--gold-2);border-bottom:1.5px solid var(--gold-2);opacity:.75;transform:rotate(45deg);transition:transform .2s,bottom .2s,opacity .15s}
#p-whatsapp .kpi[data-wx]:hover::after{opacity:1}
#p-whatsapp .kpi[data-wx][aria-expanded="true"]::after{opacity:1;transform:rotate(-135deg);bottom:9px}
#p-whatsapp .row.wa-big{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
#p-whatsapp .row.wa-big .kpi .num{font-size:clamp(28px,3.4vw,38px);text-shadow:0 0 16px rgba(255,255,255,.28);white-space:nowrap}
#p-whatsapp .row.wa-big .kpi.hl .num{text-shadow:0 0 18px rgba(212,175,55,.45)}
#p-whatsapp .row .kpi .num{white-space:nowrap}
#p-whatsapp .wa-d{display:grid;gap:16px}
#p-whatsapp .wa-g{display:grid;gap:8px}
#p-whatsapp .kpi .wa-s{color:rgba(255,255,255,.68);font-weight:500;font-size:11.5px;line-height:1.4;white-space:normal}
#p-whatsapp .wa-gh{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
@media (max-width:560px){#p-whatsapp .row:not(.wa-big){grid-template-columns:repeat(2,minmax(0,1fr))}#p-whatsapp .row .kpi .num{font-size:22px}#p-whatsapp .row.wa-big .kpi .num{font-size:28px}}

/* v8: filtro por loja + detalhe agrupado por loja */
#p-whatsapp .wa-lf{display:flex}
#p-whatsapp .wa-lf label{display:grid;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1 1 220px;max-width:320px;min-width:0}

@media (max-width:560px){#p-whatsapp .wa-lf label{max-width:none}}

#p-whatsapp .row.wa-big{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

/* v10: etiqueta JÚLIA AJUSTAR */
.wa-tg{display:flex;flex-wrap:wrap;gap:6px}
.wa-ju{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--gold);color:#060608;box-shadow:0 0 12px rgba(212,175,55,.45)}

/* v11: etiqueta AGÊNCIA AJUSTAR */
.wa-ag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:#fff;color:#060608;box-shadow:0 0 12px rgba(255,255,255,.3)}

/* v12: links por plataforma */
.wa-k .wa-r{grid-template-columns:72px minmax(0,1fr) auto}
.wa-k .wa-r>i{font-style:normal;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wa-lk{font-size:10.5px;font-weight:700;color:var(--gold-2);text-decoration:none;border:1px solid rgba(212,175,55,.45);border-radius:99px;padding:2px 8px;white-space:nowrap}
.wa-lk:hover{background:var(--gold-soft);border-color:var(--gold)}

/* v13 */
.wa-k .wa-r.g b,.wa-k .wa-r.g b a{color:#5fd38d}.wa-k .wa-r.x b a{color:#ff7a7a}
.wa-wl{text-decoration:none;border-bottom:1px dotted currentColor}
.wa-cp{margin:-1px 0 2px 80px;font-size:11px;color:#cfcdc6;min-width:0}
.wa-cp summary{cursor:pointer;color:var(--gold-2);font-weight:700;font-size:10.5px;list-style:none}
.wa-cp summary::-webkit-details-marker{display:none}.wa-cp summary::before{content:"▸ "}.wa-cp[open] summary::before{content:"▾ "}
.wa-cpt{margin:7px 0 4px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#5fd38d}.wa-cpt.x{color:#ff7a7a}
.wa-cpl{display:flex;flex-wrap:wrap;gap:4px}.wa-cpl .wa-lk{white-space:normal;overflow-wrap:anywhere}
@media(max-width:560px){.wa-cp{margin-left:0}}
